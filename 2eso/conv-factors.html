<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factores de conversión · F&amp;Q</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12101A; --panel:#1B1826; --panel2:#231F31; --line:#352F48;
  --text:#ECE8F5; --muted:#9C95B2;
  --fuchsia:#F472B6; --mint:#A8E6C8; --lemon:#FEF08A; --red:#F87171;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font-family:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.brand{font-family:"Press Start 2P",monospace;font-size:13px;color:var(--fuchsia);letter-spacing:1px;white-space:nowrap}
.title{font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.6;color:var(--text);margin:0;font-weight:400}
.levels{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.lvl{font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.5;padding:9px 12px;background:var(--panel2);color:var(--muted);border:2px solid var(--line);border-radius:6px;cursor:pointer}
.lvl:hover{color:var(--text)}
.lvl.on{background:var(--lemon);border-color:var(--lemon);color:#12101A}
.lang{display:flex;gap:4px}
.lang button{font-family:"JetBrains Mono",monospace;font-size:12px;padding:5px 8px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.lang button.on{color:#12101A;background:var(--fuchsia);border-color:var(--fuchsia)}
main{max-width:1060px;margin:0 auto;padding:16px 16px 24px}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-bottom:12px;color:var(--muted)}
.stat b{font-family:"JetBrains Mono",monospace;color:var(--text);font-size:16px;margin-left:6px}
.stats .grow{flex:1}
.btn{font-weight:700;font-size:14px;padding:9px 14px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fuchsia);border-color:var(--fuchsia);color:#12101A}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pid{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.statement{font-size:21px;font-weight:800;margin:2px 0}
.instr{color:var(--muted);margin:0 0 12px}
.kbd{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kbd span{color:var(--muted);font-size:13px;margin-right:4px}
.kbd button{font-family:"JetBrains Mono",monospace;font-size:16px;min-width:46px;padding:5px 10px;background:var(--panel2);color:var(--lemon);border:2px solid var(--line);border-radius:6px;cursor:pointer}
.kbd button:disabled{color:#4a4460;cursor:default}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:16px 8px;padding:16px 2px 12px;font-family:"JetBrains Mono",monospace}
.qty{font-size:22px;white-space:nowrap}
.ua.x,input.x{text-decoration:line-through;text-decoration-color:var(--fuchsia);text-decoration-thickness:2px;color:var(--muted)}
.factor{display:flex;align-items:center;gap:4px}
.dot{font-size:26px;color:var(--muted);padding:0 2px}
.frac{display:flex;flex-direction:column;gap:6px;padding:9px 8px 8px;border:2px solid transparent;border-radius:10px;position:relative}
.factor.ok .frac{border-color:var(--mint)}
.factor.bad .frac{border-color:var(--red)}
.fi{position:absolute;top:-10px;left:8px;font-size:11px;background:var(--panel);color:var(--muted);padding:0 4px}
.row{display:flex;gap:4px}
.bar{height:2px;background:var(--text);border-radius:2px}
input{font-family:"JetBrains Mono",monospace;font-size:17px;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:6px;padding:6px;text-align:center;min-width:0}
input:focus{outline:none;border-color:var(--fuchsia)}
input::placeholder{color:#5d5672;font-size:13px}
input:disabled{opacity:.85}
input.num{width:9ch}
input.unit{width:7ch}
input.okb{border-color:var(--mint)}
input.badb{border-color:var(--red)}
.rm{background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;align-self:flex-start}
.rm:hover{color:var(--red)}
.rm[hidden]{display:none}
.add{font-family:"JetBrains Mono",monospace;font-size:14px;padding:8px 10px;background:transparent;color:var(--mint);border:2px dashed var(--line);border-radius:8px;cursor:pointer}
.add:hover{border-color:var(--mint)}
.add[hidden]{display:none}
.eq{font-size:26px;color:var(--muted)}
.res{display:flex;align-items:center;gap:6px;font-size:20px;white-space:nowrap}
.res input.num{width:11ch}
.readout{color:var(--muted);font-size:14px;margin:0 0 12px}
.mark{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;border-radius:50%;font-weight:800;font-size:15px;vertical-align:middle}
.mark[hidden]{display:none}
.mark.ok{color:var(--mint);border:2px solid var(--mint)}
.mark.bad{color:var(--red);border:2px solid var(--red);background:rgba(248,113,113,.14);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.btn.hintb{border-color:var(--lemon);color:var(--lemon)}
.btn.solb{border-color:var(--fuchsia);color:var(--fuchsia)}
.readout b{font-family:"JetBrains Mono",monospace;color:var(--lemon);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.att{color:var(--muted);font-size:13px}
.fb{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.fb li{padding:8px 12px;border-radius:8px;background:var(--panel2);border-left:4px solid var(--line)}
.fb li.ok{border-left-color:var(--mint)}
.fb li.bad{border-left-color:var(--red)}
.fb li.note{color:var(--muted)}
.success{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(168,230,200,.10);border:2px solid var(--mint)}
.success .big{font-size:18px;font-weight:800;color:var(--mint)}
.panel{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--panel2);border:2px solid var(--lemon)}
.panel.sol{border-color:var(--fuchsia)}
.panel h3{margin:0 0 8px;font-family:"Press Start 2P",monospace;font-size:11px;font-weight:400;color:var(--lemon)}
.panel.sol h3{color:var(--fuchsia)}
.panel ul{margin:6px 0 0;padding-left:20px;font-family:"JetBrains Mono",monospace}
.panel .chain{padding:8px 0}
.sfrac{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px;font-size:17px}
.sfrac .bar{align-self:stretch}
details{margin-top:18px;color:var(--muted)}
summary{cursor:pointer;color:var(--text);font-weight:700}
details ul{margin:8px 0;padding-left:20px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 16px 18px}
footer a{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,8,16,.82);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:10}
.overlay[hidden]{display:none}
.modal{background:var(--panel);border:2px solid var(--fuchsia);border-radius:14px;padding:20px;max-width:760px;width:100%}
.modal h2{font-family:"Press Start 2P",monospace;font-size:13px;font-weight:400;color:var(--fuchsia);margin:0 0 12px;line-height:1.6}
.meta{color:var(--muted)}
.meta b{color:var(--text)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700}
td{font-family:"JetBrains Mono",monospace}
td:first-child{font-family:Nunito,system-ui,sans-serif;font-weight:700}
tr.tot td{font-weight:800;color:var(--lemon)}
.pct{font-size:17px;font-weight:800;color:var(--mint);margin:6px 0 14px}
@media (max-width:560px){
  .statement{font-size:18px}
  input{font-size:16px}
  input.num{width:8ch}
  input.unit{width:6ch}
  .qty{font-size:19px}
}
</style>
</head>
<body>
<header>
  <div class="brand" data-i="brand">F&amp;Q</div>
  <h1 class="title" data-i="title"></h1>
  <div class="levels">
    <button class="lvl" data-lvl="1" data-i="lvl1"></button>
    <button class="lvl" data-lvl="2" data-i="lvl2"></button>
    <button class="lvl" data-lvl="3" data-i="lvl3"></button>
  </div>
  <div class="lang"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
</header>

<main>
  <div class="stats">
    <span class="stat"><span data-i="correct"></span><b id="stC">0</b></span>
    <span class="stat"><span data-i="streak"></span><b id="stS">0</b></span>
    <span class="stat"><span data-i="tried"></span><b id="stT">0</b></span>
    <span class="grow"></span>
    <button class="btn ghost" id="finishB" data-i="finish"></button>
  </div>

  <section class="card">
    <div class="ptop"><div class="statement" id="statement"></div><span class="pid" id="pid"></span></div>
    <p class="instr" data-i="instr"></p>
    <div class="kbd">
      <span data-i="keyboard"></span>
      <button type="button" data-ins="mu" data-ti="kbMu" disabled>µ</button>
      <button type="button" data-ins="sq" data-ti="kbSq" disabled>x²</button>
      <button type="button" data-ins="cu" data-ti="kbCu" disabled>x³</button>
      <button type="button" data-ins="pow" data-ti="kbPow" disabled>×10ⁿ</button>
    </div>
    <div class="chain" id="chain">
      <div class="qty" id="qty"></div>
      <div id="factors" style="display:contents"></div>
      <button type="button" class="add" id="addB" data-i="add"></button>
      <span class="eq">=</span>
      <div class="res">
        <input class="num" id="resNum" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span id="resUnit"></span>
        <input class="unit" id="resUnitIn" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
      </div>
    </div>
    <div class="readout"><span data-i="remaining"></span> <b id="remain"></b><span id="remMark" class="mark" hidden></span></div>
    <div class="actions">
      <button class="btn primary" id="checkB" data-i="check"></button>
      <button class="btn" id="skipB" data-i="skip"></button>
      <button class="btn hintb" id="hintB" data-i="showHint" hidden></button>
      <button class="btn solb" id="solB" data-i="showSol" hidden></button>
      <button class="btn primary" id="nextB" data-i="next" hidden></button>
      <span class="att" id="att"></span>
    </div>
    <div id="successBox"></div>
    <ul class="fb" id="fb"></ul>
    <div id="hintBox"></div>
    <div id="solBox"></div>
    <details><summary data-i="howT"></summary><ul id="how"></ul></details>
  </section>
</main>

<footer>© Sara G.M. · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></footer>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

function lookupName(t){
  t=t.replace(/\u03BC/g,MU);
  if (WORDS[t]) return {key:WORDS[t]};
  if (t.length>=3 && WORDS[t.toLowerCase()]) return {key:WORDS[t.toLowerCase()]};
  if (ATOMS[t] && ATOMS[t].sym) return {key:t};
  let m=t.match(/^(da|[nmcdhkMGu\u00B5])?l$/);
  if (m){ const p=(m[1]||'').replace('u',MU); if (ATOMS[p+'L']) return {key:p+'L'}; }
  if (t[0]==='u' && ATOMS[MU+t.slice(1)]) return {key:MU+t.slice(1)};
  if (/^K(m|g|s|L|l|A|N|Pa)$/.test(t)) return {err:'kilo'};
  if (/^(lt|Lt|LT|lts|ltr|ltrs)$/.test(t)) return {err:'litre'};
  if (/^(seg|segs|sg|sec|secs|S)$/i.test(t) && t!=='s') return {err:'second'};
  if (/^(gr|grs|Gr)$/.test(t)) return {err:'gram'};
  if (/^(mt|mts|Mt|Mts|mtr|mtrs)$/.test(t)) return {err:'metre'};
  if (/^cc$/i.test(t)) return {err:'cc'};
  const lc=t.toLowerCase();
  const cands=Object.keys(ATOMS).filter(k=>ATOMS[k].sym && k.toLowerCase()===lc);
  if (cands.length) return {err:'case',t,cands};
  return {err:'unknown',t};
}
function parseAtom(raw){
  let t=raw, exp=1;
  const m=t.match(/^(.*?)(?:\^([+-]?\d+)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+)|(\d+))$/);
  if (m && m[1]){
    t=m[1];
    const e = m[2]!==undefined ? m[2] : m[3]!==undefined ? [...m[3]].map(c=>SUPINV[c]).join('') : m[4];
    exp=parseInt(e,10);
    if (!exp) return {err:'syntax'};
  }
  if (!t) return {err:'syntax'};
  const r=lookupName(t);
  if (r.err) return r;
  return {key:r.key,exp};
}
function parseUnit(str){
  const s=String(str||'').replace(/\s+/g,'').replace(/\u03BC/g,MU).replace(/[⋅*]/g,'·');
  if (!s) return {err:'emptyUnit'};
  const parts=s.split('/'), list=[];
  for (let i=0;i<parts.length;i++){
    const part=parts[i].replace(/^\((.*)\)$/,'$1');
    if (!part) return {err:'syntax'};
    if (i===0 && part==='1' && parts.length>1) continue;
    for (const a of part.split('·')){
      if (!a) return {err:'syntax'};
      const r=parseAtom(a);
      if (r.err) return r;
      list.push({key:r.key,exp:r.exp*(i===0?1:-1)});
    }
  }
  if (!list.length) return {err:'syntax'};
  const map={};
  list.forEach(a=>map[a.key]=(map[a.key]||0)+a.exp);
  return {list,map:clean(map)};
}
function unitErr(r){
  if (r.err==='unknown') return tr('err_unknown',r.t);
  if (r.err==='case') return tr('err_case',r.t,r.cands.join(' / '));
  return tr('err_'+r.err);
}

/* utilidades de expresiones de unidades {clave: exponente} */
const clean=m=>{ const o={}; for (const k in m) if (m[k]) o[k]=m[k]; return o; };
const sameMap=(a,b)=>{ a=clean(a); b=clean(b); const ka=Object.keys(a), kb=Object.keys(b); return ka.length===kb.length && ka.every(k=>a[k]===b[k]); };
const applyF=(cur,num,den)=>{ const o={...cur}; for (const k in num) o[k]=(o[k]||0)+num[k]; for (const k in den) o[k]=(o[k]||0)-den[k]; return clean(o); };
const mkey=m=>{ m=clean(m); return Object.keys(m).sort().map(k=>k+':'+m[k]).join(','); };
const dimsOf=m=>{ const d=[0,0,0,0]; for (const k in m){ const a=ATOMS[k]; for (let i=0;i<4;i++) d[i]+=a.dims[i]*m[k]; } return d; };
const sameDims=(a,b)=>a.every((x,i)=>x===b[i]);

function reduces(cur,num,den){

}

function unitParts(map,plural){

}
function unitText(map,plural){
  const {e,pl,num,den}=unitParts(map,plural);
  if (!e.length) return '';
  const f=([k,v])=>atomLabel(k,pl)+(Math.abs(v)!==1?sup(Math.abs(v)):'');
  let s=num.length? num.map(f).join('·') : '1';
  if (den.length) s+='/'+(den.length>1?'('+den.map(f).join('·')+')':f(den[0]));

}
function unitSpans(map,plural,net){

  if (den.length) s+='/'+(den.length>1?'('+den.map(sp).join('·')+')':sp(den[0]));
  return s;
}

function normNum(str){
  let s=String(str??'').replace(/\s+/g,'');
  if (!s) return '';
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,m=>'^'+[...m].map(c=>SUPINV[c]).join(''));
  s=s.replace(/−/g,'-').replace(/[×xX*⋅]/g,'·');
  let mant=s, tail='';
  const i=s.indexOf('·');
  if (i>=0){ mant=s.slice(0,i); tail=s.slice(i); }
  if (mant.includes(',')) mant=mant.replace(/\./g,'').replace(',','.');
  else if (/^[+-]?[1-9]\d{0,2}(\.\d{3})+$/.test(mant)) mant=mant.replace(/\./g,'');
  return mant+tail;
}
function parseNum(str){
  const s=normNum(str);
  if (!s) return NaN;
  let m;
  if ((m=s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:·10\^([+-]?\d+))?$/))) return parseFloat(m[1])*(m[2]!==undefined?10**(+m[2]):1);
  if ((m=s.match(/^([+-]?)10\^([+-]?\d+)$/))) return (m[1]==='-'?-1:1)*10**(+m[2]);
  if (/^[+-]?(?:\d+\.?\d*|\.\d+)e[+-]?\d+$/i.test(s)) return parseFloat(s);
  return NaN;
}
// cifras significativas de lo que escribe el alumno: {min,max} (los ceros finales de un entero son ambiguos)
function sigFigs(str){
  const s=normNum(str);
  const m=s.match(/^[+-]?(\d*\.?\d*)(?:·10\^[+-]?\d+|e[+-]?\d+)?$/i) || s.match(/^[+-]?()10\^[+-]?\d+$/);
  if (!m) return null;
  if (m[1]==='') return {min:1,max:1};
  const hasDot=m[1].includes('.');
  const d=m[1].replace('.','').replace(/^0+/,'');
  if (!d) return {min:1,max:1};
  if (hasDot) return {min:d.length,max:d.length};
  return {min:Math.max(1,d.replace(/0+$/,'').length),max:d.length};
}
const locDec=s=>s.replace(/\./g,',');   // coma decimal en los dos idiomas
function fmtIn(s){ return locDec(String(s).replace(/\^([+-]?\d+)/g,(m,g)=>sup(g))); }
function fmtNum(x,sig=4){
  if (!isFinite(x)) return '—';
  if (x===0) return '0';
  const ex=Math.floor(Math.log10(Math.abs(x))+1e-12);
  let s;
  if (ex>=5 || ex<=-4){
    const [m,e]=x.toExponential(sig-1).split('e');
    s=String(parseFloat(m))+'·10'+sup(parseInt(e,10));
  } else if (ex===4 && x!==Math.round(x)){
    const [m,e]=x.toExponential(sig-1).split('e');
    s=String(parseFloat(m))+'·10'+sup(parseInt(e,10));
  } else s=String(ex===4? x : parseFloat(x.toPrecision(sig)));
  return locDec(s);
}
const isApprox=x=>Math.abs(parseNum(fmtNum(x))-x)/Math.abs(x)>1e-9;
function fmtEqNum(x){
  const l=Math.log10(x), r=Math.round(l);
  if (Math.abs(l-r)<1e-9 && (r>=4 || r<=-4)) return '10'+sup(r);
  return locDec(String(parseFloat(x.toPrecision(10))));
}

const EDGES=[];
const edge=(A,vA,B,vB)=>EDGES.push({A,vA,B,vB});
edge({min:1},1,{s:1},60); edge({h:1},1,{min:1},60); edge({h:1},1,{s:1},3600); edge({dia:1},1,{h:1},24);
edge({sem:1},1,{dia:1},7); edge({mes:1},1,{dia:1},30); edge({ano:1},1,{dia:1},365);
edge({L:1},1,{dm:3},1); edge({dm:3},1,{cm:3},1000); edge({cm:3},1,{mm:3},1000); edge({dm:3},1,{mm:3},1e6);
edge({Pa:1},1,{N:1,m:-2},1); edge({atm:1},1,{Pa:1},101325); edge({atm:1},1,{mmHg:1},760);
for (const [b,exps] of [['m',[1,2,3]],['g',[1]],['L',[1]],['s',[1]],['A',[1]],['N',[1]],['Pa',[1]]])
  for (const e of exps) for (const [p,pe] of Object.entries(PREFIX)){
    const k=p+b;
    if (pe>0) edge({[k]:e},1,{[b]:e},10**(pe*e)); else edge({[b]:e},1,{[k]:e},10**(-pe*e));
  }
const EIDX={};
EDGES.forEach(E=>{ for (const k of new Set([...Object.keys(E.A),...Object.keys(E.B)])) (EIDX[k]=EIDX[k]||[]).push(E); });
function solve(from,to){
  const goal=mkey(to);
  let frontier=[{m:clean(from),path:[]}];
  const seen=new Set([mkey(from)]);
  for (let d=0; d<=6; d++){
    for (const n of frontier) if (mkey(n.m)===goal) return n.path;
    const next=[];
    for (const n of frontier){
      const es=new Set();
      for (const k in n.m) (EIDX[k]||[]).forEach(E=>es.add(E));
      for (const E of es) for (const [num,vn,den,vd] of [[E.B,E.vB,E.A,E.vA],[E.A,E.vA,E.B,E.vB]]){
        if (!reduces(n.m,num,den)) continue;
        const m=applyF(n.m,num,den), k=mkey(m);
        if (seen.has(k)) continue;
        seen.add(k);
        next.push({m,path:[...n.path,{num,vn,den,vd,E}]});
      }
    }
    frontier=next;
  }
  return null;
}

  el.value=el.value.slice(0,s)+text+el.value.slice(e);
  const p=s+text.length;
  el.focus();
  try{ el.setSelectionRange(p,p); }catch(err){}
  el.dispatchEvent(new Event('input',{bubbles:true}));
}

/* =========================================================
   Problema en pantalla
   ========================================================= */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(lvl){
  if (!S.bag[lvl].length){
    S.bag[lvl]=shuffle(PROBS.filter(p=>p.lvl===lvl).map(p=>p.id));
    if (S.bag[lvl][0]===S.lastId && S.bag[lvl].length>1) S.bag[lvl].push(S.bag[lvl].shift());
  }
  return PBYID[S.bag[lvl].shift()];
}
function leaveProblem(){ if (S.p && !S.done && S.attempts>0) record({skip:true,att:S.attempts}); }
function newProblem(){
  leaveProblem();
  S.p=pick(S.lvl); S.lastId=S.p.id;
  S.attempts=0; S.hint=false; S.sol=false; S.done=false; S.succ=null; S.fbShown=false; S.mark=null;
  $('#factors').innerHTML=''; S.factors=[];
  addFactor();
  ['#resNum','#resUnitIn'].forEach(s=>{ const el=$(s); el.value=''; el.disabled=false; el.classList.remove('okb','badb','x'); });
  ['#successBox','#hintBox','#solBox','#fb'].forEach(s=>$(s).innerHTML='');
  lock(false);
  renderProblemText(); updateLive(); updateAtt();
  if (matchMedia('(pointer:fine)').matches) S.factors[0].el.querySelector('input').focus();
}
function renderProblemText(){
  const p=S.p, v=fmtIn(p.v), many=parseNum(p.v)!==1;
  const fromT=unitText(p.from,many), toT=unitText(p.to,true);
  $('#statement').textContent = p.type==='q'? tr(p.q) : p.type==='si'? tr('stSI',v,fromT) : tr('stC',v,fromT,toT);
  $('#pid').textContent=p.id;
  $('#qty').innerHTML=`<span class="qv">${esc(v)}</span> ${unitSpans(p.from,many)}`;
  $('#resUnit').textContent = p.type==='si'? '' : toT;
  $('#resUnitIn').hidden = p.type!=='si';
}
function addFactor(){
  if (S.factors.length>=6) return;
  const el=document.createElement('div');
  el.className='factor';
  el.innerHTML=`<span class="dot">·</span><div class="frac"><span class="fi"></span>
    <div class="row"><input class="num" data-r="nN"><input class="unit" data-r="nU"></div>
    <div class="bar"></div>
    <div class="row"><input class="num" data-r="dN"><input class="unit" data-r="dU"></div></div>
    <button type="button" class="rm">×</button>`;
  $('#factors').appendChild(el);
  const f={el,get:r=>el.querySelector(`[data-r="${r}"]`)};
  S.factors.push(f);
  el.querySelectorAll('input').forEach(i=>wireInput(i,()=>{ el.classList.remove('ok','bad'); S.mark=null; }));
  el.querySelector('.rm').onclick=()=>removeFactor(f);
  renumber(); updateLive();
  return f;
}
function removeFactor(f){
  if (S.factors.length<=1) return;
  S.factors.splice(S.factors.indexOf(f),1); f.el.remove(); S.mark=null;
  renumber(); updateLive();
}
function renumber(){
  S.factors.forEach((f,i)=>{
    f.el.querySelector('.fi').textContent=i+1;
    const rm=f.el.querySelector('.rm'); rm.hidden=S.factors.length<=1 || S.done;
    rm.title=tr('remove'); rm.setAttribute('aria-label',tr('remove'));
  });
  $('#addB').hidden = S.factors.length>=6 || S.done;
}
function readF(f){ return {nN:f.get('nN').value.trim(),nU:f.get('nU').value.trim(),dN:f.get('dN').value.trim(),dU:f.get('dU').value.trim()}; }
const emptyF=v=>!v.nN && !v.nU && !v.dN && !v.dU;

// tachado en vivo y unidades que quedan
function updateLive(){
  const p=S.p; if (!p) return;
  const net={...p.from}, sides=[];
  S.factors.forEach(f=>[['nU',1],['dU',-1]].forEach(([r,sg])=>{
    const el=f.get(r), pu=parseUnit(el.value);
    sides.push({el,map:pu.err?null:pu.map});
    if (!pu.err) for (const k in pu.map) net[k]=(net[k]||0)+sg*pu.map[k];
  }));
  $$('#qty .ua').forEach(sp=>sp.classList.toggle('x',net[sp.dataset.k]===0));
  sides.forEach(s=>s.el.classList.toggle('x',!!s.map && Object.keys(s.map).every(k=>net[k]===0)));
  $('#remain').textContent=unitText(clean(net))||'—';
  renderMark();
}
function renderMark(){
  const m=$('#remMark');
  m.hidden=!S.mark;
  if (!S.mark) return;
  m.className='mark '+S.mark;
  m.textContent= S.mark==='ok'? '✓' : '!';
  m.title=tr(S.mark==='ok'?'markOk':'markBad');
  m.setAttribute('aria-label',m.title);
}

/* =========================================================
   Corrección
   ========================================================= */
function sideIssue(pu){
  const L=pu.list;
  if (L.length>1){
    const ok=L.length===2 && ATOMS[L[0].key].kind==='force' && L[0].exp===1 && ATOMS[L[1].key].kind==='len' && L[1].exp===-2;
    return ok? null : 'compound';
  }
  const a=L[0];
  if (a.exp<0) return 'compound';
  if (a.exp!==1){
    const k=ATOMS[a.key].kind;
    if (k==='len' && (a.exp===2 || a.exp===3)) return null;
    return k==='time'? 'timeSq' : 'powOnly';
  }
  return null;
}
const allKind=(m,kind)=>Object.keys(m).every(k=>ATOMS[k].kind===kind);
function evaluate(){
  const p=S.p, out={factors:[],complete:true,used:0};
  let cur={...p.from}, allOk=true, broken=false;
  let facs=S.factors.filter(f=>!emptyF(readF(f)));
  if (!facs.length) facs=[S.factors[0]];
  facs.forEach(f=>{
    const idx=S.factors.indexOf(f)+1, r={idx,el:f.el,msgs:[],bad:[]}, v=readF(f);
    if (!v.nN || !v.nU || !v.dN || !v.dU){
      r.msgs.push(tr('fIncomplete')); out.complete=false; allOk=false; broken=true;
      ['nN','nU','dN','dU'].forEach(k=>{ if (!v[k]) r.bad.push(k); });
      out.factors.push(r); return;
    }
    out.used++;
    const vn=parseNum(v.nN), vd=parseNum(v.dN);
    if (!(vn>0)){ r.msgs.push(tr('badNum',tr('num'))); r.bad.push('nN'); }
    if (!(vd>0)){ r.msgs.push(tr('badNum',tr('den'))); r.bad.push('dN'); }
    const nu=parseUnit(v.nU), du=parseUnit(v.dU);
    if (nu.err){ r.msgs.push(unitErr(nu)); r.bad.push('nU'); }
    if (du.err){ r.msgs.push(unitErr(du)); r.bad.push('dU'); }
    const issues=(!nu.err && !du.err)? [...new Set([sideIssue(nu),sideIssue(du)].filter(Boolean))] : [];
    if (issues.includes('compound')){ r.msgs.push(tr('compound')); broken=true; }
    else if (!nu.err && !du.err){
      issues.forEach(k=>r.msgs.push(tr(k)));
      const dimsOk=sameDims(dimsOf(nu.map),dimsOf(du.map)), same=sameMap(nu.map,du.map);
      if (!dimsOk) r.msgs.push(tr('dims',unitText(nu.map),unitText(du.map)));
      else if (same) r.msgs.push(tr('same'));
      else if (vn>0 && vd>0){
        const q=(vn*siOf(nu.map))/(vd*siOf(du.map));
        if (Math.abs(q-1)>1e-6){
          const a=`${fmtIn(v.nN)} ${unitText(nu.map,vn!==1)}`, b=`${fmtIn(v.dN)} ${unitText(du.map,vd!==1)}`;
          if (Math.abs(q-1)<0.02) r.msgs.push(tr('eqRounded',a,b));
          else {
            let s=tr('eqWrong',a,b);
            const lg=Math.log10(q);
            if (allKind(nu.map,'time') && allKind(du.map,'time')) s+=tr('tipTime');
            else if (Math.abs(lg-Math.round(lg))<1e-6){
              s+=tr('tipPow');
              const e=nu.list.length===1 && ATOMS[nu.list[0].key].kind==='len' ? nu.list[0].exp : 1;
              if (e===2) s+=tr('tipArea');
              if (e===3) s+=tr('tipVol');
            }
            r.msgs.push(s);
          }
        }
      }
      if (dimsOk && !same && !reduces(cur,nu.map,du.map)){
        if (reduces(cur,du.map,nu.map)){
          const k=Object.keys({...nu.map,...du.map}).find(k=>cur[k]);
          r.msgs.push(tr('flip',atomLabel(k),cur[k]>0?tr('den'):tr('num')));
        } else r.msgs.push(tr('noCancel',unitText(cur)||'—'));
      }
      cur=applyF(cur,nu.map,du.map);
    } else broken=true;
    r.ok=!r.msgs.length;
    if (!r.ok) allOk=false;
    out.factors.push(r);
  });
  if (!broken){
    out.unitsOk=sameMap(cur,p.to);
    out.unitsMsg= out.unitsOk? tr('endOk',unitText(p.to)) : tr('endWrong',unitText(cur)||'—',unitText(p.to));
  }
  const rv=$('#resNum').value.trim();
  if (!rv){ out.complete=false; out.resMsg=tr('resEmpty'); }
  else {
    const x=parseNum(rv);
    if (isNaN(x)) out.resMsg=tr('resBad');
    else {
      const rel=Math.abs(x-p.ans)/Math.abs(p.ans);
      const sf=sigFigs(rv), few=sf && sf.max<3, many=sf && sf.min>4;
      if (rel<1e-9 && !isApprox(p.ans)) out.resOk=true;
      else if (rel<=0.01){
        if (few) out.resMsg=tr('resFewSig');
        else if (many) out.resMsg=tr('resManySig');
        else out.resOk=true;
      }
      else if (few && x!==0 && Math.abs(x-p.ans)<=10**(Math.floor(Math.log10(Math.abs(x)))-sf.max+1)) out.resMsg=tr('resFewSig');
      else {
        const q=x/p.ans, lg=Math.log10(Math.abs(q)), rl=Math.round(lg);
        out.resMsg = (q>0 && rl!==0 && Math.abs(lg-rl)<0.005)? tr('resPow') : rel<0.05? tr('resClose') : tr('resWrong');
      }
    }
  }
  if (p.type==='si'){
    const ru=$('#resUnitIn').value.trim();
    if (!ru){ out.complete=false; out.resUnitMsg=tr('err_emptyUnit'); }
    else {
      const pu=parseUnit(ru);
      if (pu.err) out.resUnitMsg=unitErr(pu);
      else if (!sameMap(pu.map,p.to)) out.resUnitMsg=tr('resUnitWrong');
      else out.resUnitOk=true;
    }
  } else out.resUnitOk=true;
  out.success = out.complete && allOk && out.unitsOk && out.resOk && out.resUnitOk;
  return out;
}
function renderFeedback(ev){
  S.fbShown=true;
  S.factors.forEach(f=>{ f.el.classList.remove('ok','bad'); f.el.querySelectorAll('input').forEach(i=>i.classList.remove('okb','badb')); });
  const li=[];
  ev.factors.forEach(r=>{
    r.el.classList.add(r.ok?'ok':'bad');
    const f=S.factors[r.idx-1]; r.bad.forEach(k=>f.get(k).classList.add('badb'));
    li.push(`<li class="${r.ok?'ok':'bad'}"><b>${esc(tr('factor',r.idx))}:</b> ${esc(r.ok?tr('fOk'):r.msgs.join(' '))}</li>`);
  });
  if (ev.unitsMsg) li.push(`<li class="${ev.unitsOk?'ok':'bad'}"><b>${esc(tr('units'))}:</b> ${esc(ev.unitsMsg)}</li>`);
  const resGood=ev.resOk && ev.resUnitOk;
  const resTxt=resGood? tr('resOk') : [ev.resOk?'':ev.resMsg, ev.resUnitOk?'':ev.resUnitMsg].filter(Boolean).join(' ');
  li.push(`<li class="${resGood?'ok':'bad'}"><b>${esc(tr('result'))}:</b> ${esc(resTxt)}</li>`);
  $('#resNum').classList.toggle('okb',!!ev.resOk); $('#resNum').classList.toggle('badb',!ev.resOk);
  if (S.p.type==='si'){ $('#resUnitIn').classList.toggle('okb',!!ev.resUnitOk); $('#resUnitIn').classList.toggle('badb',!ev.resUnitOk); }
  if (!ev.complete) li.push(`<li class="note">${esc(tr('incompleteNote'))}</li>`);
  $('#fb').innerHTML=li.join('');
}
function check(){
  if (S.done) return;
  const ev=evaluate();
  renderFeedback(ev);
  S.mark= ev.unitsOk===true? 'ok' : ev.unitsOk===false? 'bad' : null;
  renderMark();
  if (ev.success){
    S.done=true; S.succ={att:S.attempts+1,hint:S.hint,sol:S.sol,used:ev.used};
    record({ok:true,att:S.attempts+1});
    renderSuccess(); lock(true);
  } else if (ev.complete) S.attempts++;
  updateAtt();
}
function lock(on){
  $$('#chain input').forEach(i=>i.disabled=on);
  $('#checkB').hidden=on; $('#skipB').hidden=on; $('#nextB').hidden=!on;
  updateAtt();
  renumber(); setPalette();
  if (on) $('#nextB').focus();
}
function updateAtt(){
  $('#att').textContent=`${tr('attempts',S.attempts)} · ${tr('attemptsNote')}`;
  $('#hintB').hidden = S.done || S.hint || S.attempts<3;
  $('#solB').hidden = S.done || S.sol || S.attempts<5;
}
function renderSuccess(){
  const p=S.p, i=S.succ; if (!i) return;
  let how=i.att===1? tr('first') : tr('inN',i.att);
  if (i.sol) how+=', '+tr('withSol');
  else if (i.hint) how+=', '+tr('withHint');
  const minF=(solOf(p)||[]).length;
  const tip=i.used>minF? `<div>${esc(tr('fewer',i.used,minF))}</div>` : '';
  const many=parseNum(p.v)!==1;
  $('#successBox').innerHTML=`<div class="success"><div class="big">${esc(tr('success'))} ${esc(fmtIn(p.v))} ${esc(unitText(p.from,many))} ${isApprox(p.ans)?'≈':'='} ${esc(fmtNum(p.ans))} ${esc(unitText(p.to,true))}</div><div>${esc(tr('solvedHow',how))}</div>${tip}</div>`;
}
function renderHint(){
  const eqs=[...new Set((solOf(S.p)||[]).map(st=>eqText(st.E)))];
  $('#hintBox').innerHTML=`<div class="panel"><h3>${esc(tr('hintT'))}</h3><div>${esc(tr('hintIntro'))}</div><ul>${eqs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;
}
function renderSolution(){
  const p=S.p, sol=solOf(p)||[], net={...p.from};
  sol.forEach(st=>{ for (const k in st.num) net[k]=(net[k]||0)+st.num[k]; for (const k in st.den) net[k]=(net[k]||0)-st.den[k]; });
  const many=parseNum(p.v)!==1;
  const q=`<span class="qty">${esc(fmtIn(p.v))} ${unitSpans(p.from,many,net)}</span>`;
  const fr=sol.map(st=>`<span class="dot">·</span><span class="sfrac"><span>${esc(fmtEqNum(st.vn))} ${unitSpans(st.num,st.vn!==1,net)}</span><span class="bar"></span><span>${esc(fmtEqNum(st.vd))} ${unitSpans(st.den,st.vd!==1,net)}</span></span>`).join('');
  $('#solBox').innerHTML=`<div class="panel sol"><h3>${esc(tr('solT'))}</h3><div class="chain">${q}${fr}<span class="eq">${isApprox(p.ans)?'≈':'='}</span><span class="res">${esc(fmtNum(p.ans))} ${esc(unitText(p.to,true))}</span></div><div class="att">${esc(tr('solNote'))}</div></div>`;
}

/* =========================================================
   Resumen de la sesión
   ========================================================= */
function showSummary(){
  if (S.p && !S.done && S.attempts>0){ record({skip:true,att:S.attempts}); S.done=true; S.needNew=true; }
  const r=SESSION.recs;
  const okk=q=>q.ok&&!q.sol;
  const row=(name,x)=>[name,x.length,x.filter(q=>okk(q)&&q.att===1).length,x.filter(q=>okk(q)&&q.att>1&&!q.hint).length,
    x.filter(q=>okk(q)&&q.hint).length,x.filter(q=>q.sol).length,x.filter(q=>q.skip&&!q.sol).length];
  const rows=[1,2,3].map(l=>row(tr('lvl'+l),r.filter(q=>q.lvl===l)));
  rows.push(row(tr('total'),r));
  const ok=r.filter(q=>q.ok&&!q.sol).length;
  const mins=Math.max(1,Math.round((Date.now()-SESSION.start)/60000));
  const date=new Date(SESSION.start).toLocaleString(LANG==='es'?'es-ES':'en-GB',{dateStyle:'medium',timeStyle:'short'});
  const head=['colLvl','colTried','colFirst','colMore','colHint','colSol','colSkip'].map(k=>`<th>${esc(tr(k))}</th>`).join('');
  const body=rows.map((x,i)=>`<tr${i===3?' class="tot"':''}>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  $('#modal').innerHTML=`<h2>${esc(tr('sumT'))}</h2>
    <div class="meta">${esc(tr('date'))}: <b>${esc(date)}</b> · ${esc(tr('duration'))}: <b>${esc(tr('minutes',mins))}</b></div>
    <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="pct">${esc(r.length? tr('pct',Math.round(100*ok/r.length)) : tr('none'))}</div>
    <div class="actions"><button class="btn primary" id="keepB">${esc(tr('keepGoing'))}</button><button class="btn" id="newSesB">${esc(tr('newSession'))}</button></div>`;
  $('#overlay').hidden=false;
  $('#keepB').onclick=()=>{ $('#overlay').hidden=true; if (S.needNew){ S.needNew=false; newProblem(); } };
  $('#newSesB').onclick=()=>{ SESSION={start:Date.now(),recs:[]}; saveSession(); updateStats(); $('#overlay').hidden=true; S.needNew=false; S.done=true; newProblem(); };
}

/* =========================================================
   Idioma e inicio
   ========================================================= */
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=tr('title')+' · '+tr('brand');
  $$('[data-i]').forEach(el=>el.textContent=tr(el.dataset.i));
  $$('[data-ti]').forEach(el=>{ el.title=tr(el.dataset.ti); el.setAttribute('aria-label',tr(el.dataset.ti)); });
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  $('#how').innerHTML=tr('how').map(x=>`<li>${esc(x)}</li>`).join('');
  $$('input.num').forEach(i=>i.placeholder=tr('numPh'));
  $$('input.unit').forEach(i=>i.placeholder=tr('unitPh'));
}
function setLang(l){
  LANG=l;
  try{ localStorage.setItem('fyq-factores-lang',l); }catch(e){}
  applyI18n(); renumber();
  if (!S.p) return;
  renderProblemText(); updateLive(); updateAtt();
  if (S.fbShown) renderFeedback(evaluate());
  if (S.succ) renderSuccess();
  if (S.hint) renderHint();
  if (S.sol) renderSolution();
  if (!$('#overlay').hidden) showSummary();
}
function setLevel(l){
  S.lvl=l;
  $$('.lvl').forEach(b=>b.classList.toggle('on',+b.dataset.lvl===l));
  newProblem();
}

$$('.lvl').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lvl));
$$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$('#addB').onclick=()=>{ const f=addFactor(); if (f) f.el.querySelector('input').focus(); };
$('#checkB').onclick=check;
$('#skipB').onclick=newProblem;
$('#hintB').onclick=()=>{ S.hint=true; renderHint(); updateAtt(); };
$('#solB').onclick=()=>{ if (S.done) return; S.sol=true; S.done=true; record({sol:true,att:S.attempts}); renderSolution(); lock(true); };
$('#nextB').onclick=newProblem;
$('#finishB').onclick=showSummary;
wireInput($('#resNum'),null); wireInput($('#resUnitIn'),null);
document.addEventListener('focusin',e=>{ if (e.target.matches('#chain input')){ S.focus=e.target; setPalette(); } });
document.addEventListener('keydown',e=>{
  if (e.key==='Enter' && e.target.matches('#chain input')){ e.preventDefault(); check(); }
  if (e.key==='Escape' && !$('#overlay').hidden) $('#keepB').click();
});
$$('.kbd button').forEach(b=>{
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    const el=S.focus; if (!el || el.disabled) return;
    const k=b.dataset.ins;
    if (k==='pow') insertAt(el, el.value.slice(0,el.selectionStart??el.value.length).trim()? '·10^' : '10^');
    else insertAt(el,{mu:MU,sq:'²',cu:'³'}[k]);
  });
});
try{ const l=localStorage.getItem('fyq-factores-lang'); if (l==='en'||l==='es') LANG=l; }catch(e){}
applyI18n(); updateStats(); setLevel(1);

window.__fyq={sigFigs,PROBS,solve,solOf,parseNum,parseUnit,evaluate,S,addFactor,check,setLevel,newProblem,fmtNum,eqText,fmtEqNum,unitText,PBYID};
</script>
